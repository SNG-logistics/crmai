<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive 3D Robot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0d0d1a; font-family: 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }

    #info {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 14px;
      letter-spacing: 0.3px;
      pointer-events: none;
      text-align: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 18px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    #info span { color: rgba(100, 200, 255, 0.6); }

    #status-dot {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e88;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      letter-spacing: 1px;
      transition: opacity 0.8s ease;
      z-index: 10;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: #60b0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  Initializing robot…
</div>

<div id="info">🖱 <span>drag</span> to orbit &nbsp;·&nbsp; <span>scroll</span> to zoom</div>
<div id="status-dot"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Scene ────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d1a);
scene.fog = new THREE.Fog(0x0d0d1a, 10, 18);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(4.5, 3.2, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

// ─── Controls ─────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI / 2 + 0.15;
controls.update();

// ─── Lights ───────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x404070, 0.4);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffeedd, 2.2);
keyLight.position.set(4, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
keyLight.shadow.camera.near = 0.1;
keyLight.shadow.camera.far = 20;
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8899ff, 0.6);
fillLight.position.set(-3, 2, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x4488ff, 0.8);
rimLight.position.set(-2, 4, -6);
scene.add(rimLight);

const hemi = new THREE.HemisphereLight(0x4466aa, 0x222244, 0.4);
scene.add(hemi);

// ─── Ground ───────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x111122,
  roughness: 0.9,
  metalness: 0.1,
  transparent: true,
  opacity: 0.8,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// Grid helper — custom
const gridHelper = new THREE.GridHelper(20, 40, 0x3355aa, 0x224488);
gridHelper.position.y = 0;
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.3;
scene.add(gridHelper);

// ─── Material Factory ─────────────────────────────────────────────
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.4,
    metalness: opts.metalness ?? 0.7,
    ...opts,
  });
}

const palette = {
  primary: 0x3a7bd5,
  primaryDark: 0x1a3a7a,
  accent: 0xff4455,
  accent2: 0x44ddff,
  body: 0x5588cc,
  joint: 0x334466,
  darkMetal: 0x223355,
  lightMetal: 0x88bbee,
  eyeGlow: 0x44ddff,
};

// ─── Robot Construction ──────────────────────────────────────────
const robot = new THREE.Group();

// ──────── Torso ────────
const torsoMat = mat(palette.primary, { roughness: 0.35, metalness: 0.8 });
const torsoGeo = new THREE.BoxGeometry(1.6, 1.8, 0.9);
const torso = new THREE.Mesh(torsoGeo, torsoMat);
torso.position.y = 1.1;
torso.castShadow = true;
robot.add(torso);

// Chest plate detail
const chestMat = mat(palette.lightMetal, { roughness: 0.3, metalness: 0.9 });
const chestGeo = new THREE.BoxGeometry(1.0, 0.8, 0.15);
const chest = new THREE.Mesh(chestGeo, chestMat);
chest.position.set(0, 1.3, 0.5);
robot.add(chest);

// Chest center indicator
const coreMat = new THREE.MeshStandardMaterial({
  color: palette.accent2,
  emissive: palette.accent2,
  emissiveIntensity: 0.5,
  roughness: 0.2,
  metalness: 0.3,
});
const coreGeo = new THREE.CircleGeometry(0.18, 20);
const core = new THREE.Mesh(coreGeo, coreMat);
core.position.set(0, 1.3, 0.6);
robot.add(core);

// Shoulder pads
const shoulderMat = mat(palette.primaryDark, { roughness: 0.3, metalness: 0.9 });
for (const side of [-1, 1]) {
  const sGeo = new THREE.SphereGeometry(0.3, 12, 12, 0, Math.PI * 2, 0, Math.PI / 2);
  const shoulder = new THREE.Mesh(sGeo, shoulderMat);
  shoulder.position.set(side * 1.0, 1.85, 0);
  shoulder.rotation.z = side * 0.2;
  shoulder.scale.set(1, 0.8, 1.2);
  robot.add(shoulder);
}

// ──────── Head ────────
const headGroup = new THREE.Group();
headGroup.position.y = 2.15;

const headMat = mat(palette.primary, { roughness: 0.3, metalness: 0.85 });
const headGeo = new THREE.BoxGeometry(0.9, 0.85, 0.8);
const headMesh = new THREE.Mesh(headGeo, headMat);
// Bevel edges slightly
headMesh.geometry = new THREE.BoxGeometry(0.9, 0.85, 0.8);
headMesh.castShadow = true;
headGroup.add(headMesh);

// Face plate
const faceMat = mat(palette.darkMetal, { roughness: 0.2, metalness: 0.95 });
const faceGeo = new THREE.BoxGeometry(0.6, 0.5, 0.08);
const face = new THREE.Mesh(faceGeo, faceMat);
face.position.set(0, 0.02, 0.43);
headGroup.add(face);

// Eyes
const eyeMat = new THREE.MeshStandardMaterial({
  color: palette.eyeGlow,
  emissive: palette.eyeGlow,
  emissiveIntensity: 1.2,
  roughness: 0.1,
  metalness: 0.1,
});
for (const side of [-1, 1]) {
  const eyeGeo = new THREE.SphereGeometry(0.08, 12, 12);
  const eye = new THREE.Mesh(eyeGeo, eyeMat);
  eye.position.set(side * 0.15, 0.05, 0.47);
  headGroup.add(eye);
}

// Eye glow points (small lights)
for (const side of [-1, 1]) {
  const glowMat = new THREE.MeshStandardMaterial({
    color: palette.eyeGlow,
    emissive: palette.eyeGlow,
    emissiveIntensity: 2,
    transparent: true,
    opacity: 0.4,
  });
  const gGeo = new THREE.SphereGeometry(0.03, 8, 8);
  const glow = new THREE.Mesh(gGeo, glowMat);
  glow.position.set(side * 0.15, 0.05, 0.48);
  headGroup.add(glow);
}

// Visor strip
const visorMat = new THREE.MeshStandardMaterial({
  color: 0x112233,
  roughness: 0.1,
  metalness: 0.9,
});
const visorGeo = new THREE.BoxGeometry(0.5, 0.04, 0.05);
const visor = new THREE.Mesh(visorGeo, visorMat);
visor.position.set(0, -0.05, 0.47);
headGroup.add(visor);

// Antenna
const antennaMat = mat(palette.lightMetal, { roughness: 0.2, metalness: 0.9 });
const antennaBase = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.3, 8), antennaMat);
antennaBase.position.set(0, 0.5, 0);
headGroup.add(antennaBase);

const antennaTipMat = new THREE.MeshStandardMaterial({
  color: 0xff4444,
  emissive: 0xff4444,
  emissiveIntensity: 0.8,
  roughness: 0.3,
});
const antennaTip = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), antennaTipMat);
antennaTip.position.set(0, 0.66, 0);
headGroup.add(antennaTip);

// Ear/side panels
for (const side of [-1, 1]) {
  const earMat = mat(palette.joint, { roughness: 0.3, metalness: 0.7 });
  const ear = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.15), earMat);
  ear.position.set(side * 0.5, 0.02, 0);
  headGroup.add(ear);
}

robot.add(headGroup);

// ──────── Arms ────────
function createArm(side) {
  const armGroup = new THREE.Group();
  armGroup.position.set(side * 1.05, 1.8, 0);

  // Upper arm
  const upperMat = mat(palette.body, { roughness: 0.4, metalness: 0.75 });
  const upperGeo = new THREE.BoxGeometry(0.4, 0.9, 0.45);
  const upper = new THREE.Mesh(upperGeo, upperMat);
  upper.position.y = -0.45;
  upper.castShadow = true;
  armGroup.add(upper);

  // Elbow joint
  const jointMat = mat(palette.joint, { roughness: 0.3, metalness: 0.8 });
  const joint = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), jointMat);
  joint.position.y = -0.9;
  armGroup.add(joint);

  // Forearm (pivots at elbow)
  const forearmGroup = new THREE.Group();
  forearmGroup.position.y = -0.9;

  const foreMat = mat(palette.primary, { roughness: 0.35, metalness: 0.8 });
  const foreGeo = new THREE.BoxGeometry(0.35, 0.8, 0.38);
  const fore = new THREE.Mesh(foreGeo, foreMat);
  fore.position.y = -0.4;
  fore.castShadow = true;
  forearmGroup.add(fore);

  // Hand
  const handMat = mat(palette.darkMetal, { roughness: 0.3, metalness: 0.85 });
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.3), handMat);
  hand.position.y = -0.85;
  forearmGroup.add(hand);

  // Fingers (3 little boxes)
  for (let i = -1; i <= 1; i++) {
    const finger = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.12, 0.06),
      handMat
    );
    finger.position.set(i * 0.08, -0.96, 0.06);
    forearmGroup.add(finger);
  }

  armGroup.add(forearmGroup);
  armGroup.userData.forearm = forearmGroup;

  return armGroup;
}

const armL = createArm(-1);
const armR = createArm(1);
robot.add(armL);
robot.add(armR);

// ──────── Legs ────────
function createLeg(side) {
  const legGroup = new THREE.Group();
  legGroup.position.set(side * 0.45, 0.2, 0);

  // Thigh
  const thighMat = mat(palette.body, { roughness: 0.4, metalness: 0.75 });
  const thighGeo = new THREE.BoxGeometry(0.5, 0.7, 0.55);
  const thigh = new THREE.Mesh(thighGeo, thighMat);
  thigh.position.y = -0.35;
  thigh.castShadow = true;
  legGroup.add(thigh);

  // Knee joint
  const jointMat = mat(palette.joint, { roughness: 0.3, metalness: 0.8 });
  const knee = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 10), jointMat);
  knee.position.y = -0.7;
  legGroup.add(knee);

  // Shin
  const shinGroup = new THREE.Group();
  shinGroup.position.y = -0.7;

  const shinMat = mat(palette.primary, { roughness: 0.35, metalness: 0.8 });
  const shinGeo = new THREE.BoxGeometry(0.45, 0.7, 0.45);
  const shin = new THREE.Mesh(shinGeo, shinMat);
  shin.position.y = -0.35;
  shin.castShadow = true;
  shinGroup.add(shin);

  // Foot
  const footMat = mat(palette.darkMetal, { roughness: 0.3, metalness: 0.85 });
  const footGeo = new THREE.BoxGeometry(0.5, 0.12, 0.65);
  const foot = new THREE.Mesh(footGeo, footMat);
  foot.position.set(0, -0.72, 0.07);
  shinGroup.add(foot);

  // Ankle ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.04, 8, 12), footMat);
  ring.position.y = -0.7;
  ring.rotation.x = Math.PI / 2;
  shinGroup.add(ring);

  legGroup.add(shinGroup);
  legGroup.userData.shin = shinGroup;

  return legGroup;
}

const legL = createLeg(-1);
const legR = createLeg(1);
robot.add(legL);
robot.add(legR);

// ──────── Backpack / thruster ────────
const packMat = mat(palette.primaryDark, { roughness: 0.3, metalness: 0.9 });
const packGeo = new THREE.BoxGeometry(0.9, 0.7, 0.35);
const pack = new THREE.Mesh(packGeo, packMat);
pack.position.set(0, 1.2, -0.65);
pack.castShadow = true;
robot.add(pack);

// Thruster nozzles
for (let i = -1; i <= 1; i += 2) {
  const nozzleMat = mat(palette.darkMetal, { roughness: 0.2, metalness: 0.95 });
  const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.15, 10), nozzleMat);
  nozzle.position.set(i * 0.25, 0.9, -0.8);
  nozzle.rotation.x = Math.PI / 2;
  robot.add(nozzle);
}

robot.position.y = 0;
scene.add(robot);

// ─── Particles ────────────────────────────────────────────────────
const particleCount = 300;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i++) {
  positions[i] = (Math.random() - 0.5) * 20;
  positions[i] += i % 3 === 1 ? 3 : 0;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0x4488ff,
  size: 0.03,
  transparent: true,
  opacity: 0.5,
  blending: THREE.AdditiveBlending,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ─── Animations ───────────────────────────────────────────────────
let time = 0;
const blinkPeriod = 4; // seconds
let blinkTimer = 0;
let isBlinking = false;

function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  // ── Idle breathing ──
  const breathe = Math.sin(time * 0.8) * 0.005;
  torso.position.y = 1.1 + breathe;
  chest.position.y = 1.3 + breathe;
  core.position.y = 1.3 + breathe;
  pack.position.y = 1.2 + breathe;
  for (let i = -1; i <= 1; i += 2) {
    const n = robot.children.find(
      (c) => c.position.x === i * 0.25 && c.position.z === -0.8
    );
    if (n) n.position.y = 0.9 + breathe;
  }

  // ── Head sway ──
  headGroup.rotation.z = Math.sin(time * 0.4) * 0.04;
  headGroup.rotation.x = Math.sin(time * 0.3 + 0.5) * 0.03;

  // ── Arm swing ──
  armL.rotation.x = Math.sin(time * 0.65) * 0.12 - 0.1;
  armR.rotation.x = Math.sin(time * 0.65 + Math.PI) * 0.12 - 0.1;

  // ── Forearm slight bounce ──
  if (armL.userData.forearm) {
    armL.userData.forearm.rotation.x = Math.sin(time * 0.7 + 1) * 0.1 + 0.15;
    armR.userData.forearm.rotation.x = Math.sin(time * 0.7 + 1 + Math.PI) * 0.1 + 0.15;
  }

  // ── Leg sway ──
  legL.rotation.x = Math.sin(time * 0.65 + Math.PI * 0.5) * 0.03;
  legR.rotation.x = Math.sin(time * 0.65 + Math.PI * 1.5) * 0.03;

  // ── Shin bounce ──
  if (legL.userData.shin) {
    legL.userData.shin.rotation.x = Math.sin(time * 0.5 + 2) * 0.02;
    legR.userData.shin.rotation.x = Math.sin(time * 0.5 + 2 + Math.PI) * 0.02;
  }

  // ── Eye glow pulse ──
  const glowPulse = 0.8 + Math.sin(time * 2) * 0.2;
  eyeMat.emissiveIntensity = glowPulse * 1.2;

  // ── Core pulse ──
  const corePulse = 0.3 + Math.sin(time * 1.5) * 0.2;
  coreMat.emissiveIntensity = corePulse;

  // ── Antenna blink ──
  const antBlink = 0.5 + Math.sin(time * 3) * 0.5;
  antennaTipMat.emissiveIntensity = 0.3 + antBlink * 0.7;

  // ── Eye blink (occasional) ──
  blinkTimer += 0.016;
  if (!isBlinking && blinkTimer > blinkPeriod) {
    isBlinking = true;
    blinkTimer = 0;
  }
  if (isBlinking) {
    const b = Math.min(blinkTimer * 10, 1);
    const ease = b < 0.5 ? 2 * b * b : 1 - Math.pow(-2 * b + 2, 2) / 2;
    const scaleY = 1 - ease * 0.9;
    // Find eyes and scale them
    headGroup.children.forEach((child) => {
      if (
        child.isMesh &&
        child.material === eyeMat &&
        Math.abs(child.position.z - 0.47) < 0.02
      ) {
        child.scale.y = scaleY;
      }
    });
    if (blinkTimer > 0.3) {
      isBlinking = false;
      blinkTimer = 0;
    }
  }

  // ── Particles drift ──
  const pos = particles.geometry.attributes.position.array;
  for (let i = 1; i < pos.length; i += 3) {
    pos[i] += Math.sin(time + i) * 0.0003;
    pos[i - 1] += Math.cos(time * 0.5 + i) * 0.0003;
    if (pos[i] > 8) pos[i] = -2;
    if (pos[i] < -2) pos[i] = 8;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ─── Resize ───────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Loading screen ──────────────────────────────────────────────
document.getElementById('loading').classList.add('hidden');
setTimeout(() => {
  document.getElementById('loading').style.display = 'none';
}, 1000);

console.log('🤖 Robot initialized — drag to orbit, scroll to zoom');
</script>
</body>
</html>
